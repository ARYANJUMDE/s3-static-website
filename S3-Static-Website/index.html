<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS S3 Static Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
            color: #00eaff;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tag {
            display: inline-block;
            background: #00eaff;
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            margin: 5px;
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🚀 AWS S3 Static Website</h1>
        <p>
            This website is hosted on <strong>Amazon S3</strong> using static website hosting.
            It demonstrates basic cloud concepts like object storage, public access,
            and serverless hosting.
        </p>

        <div>
            <span class="tag">AWS S3</span>
            <span class="tag">Static Website</span>
            <span class="tag">Cloud Project</span>
        </div>

        <footer>
            Created by Aryan | Cloud Learning Project
        </footer>
    </div>
</body>
</html>
